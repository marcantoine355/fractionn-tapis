<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fractionné tapis</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232732;--txt:#f2f4f8;--mut:#9aa3b2;--acc:#4f8cff;--easy:#1f9d62;--hard:#e5533d;--ready:#4b5565;--line:#2c313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
button{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);font-weight:700}
button.dan{color:#ff8a7a}
button.big{padding:16px;font-size:18px;width:100%}
button.sm{padding:6px 12px;font-size:15px}
input{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
label.l{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.dur{display:flex;gap:4px;align-items:center}
.dur input{width:62px;text-align:center}
.dur span{color:var(--mut);font-size:13px}
.f{display:flex;flex-direction:column}
.mut{color:var(--mut);font-size:14px}
.gap{display:flex;gap:8px;justify-content:center;margin:-4px 0 12px}
.gap button{background:transparent;border-style:dashed;color:var(--mut);font-size:14px;padding:6px 12px}
.hist{padding:12px 14px;margin-bottom:8px}
/* lecteur */
#run{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));transition:background .3s}
#run.ready{background:var(--ready)}#run.easy{background:var(--easy)}#run.hard{background:var(--hard)}#run.done{background:#2b3b66}
#run .top{display:flex;justify-content:space-between;font-size:15px;opacity:.92}
#run .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#run .lab{font-size:28px;font-weight:800}
#run .time{font-size:clamp(84px,30vw,170px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#run .nxt{font-size:17px;opacity:.95;margin-top:10px}
.bar{height:10px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar>i{display:block;height:100%;background:#fff;width:0}
#run .ctl{display:flex;gap:10px}
#run .ctl button{flex:1;background:rgba(0,0,0,.28);border-color:transparent;padding:16px 6px;font-size:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="run" class="hidden"></div>

<script>
/* ---------- stockage ---------- */
const KEY='fractionne-v2',HKEY='fractionne-hist-v2';
function loadJ(k){try{const v=JSON.parse(localStorage.getItem(k));if(Array.isArray(v))return v}catch(e){}return []}
function saveJ(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
let sessions=loadJ(KEY),hist=loadJ(HKEY);
let editing=null,isNew=false;
let ui={rep:null,form:{n:3,e:300,r:60,last:false}};

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const short=s=>s%60===0?Math.floor(s/60)+"'":fmt(s);
const steps=s=>s.steps.filter(x=>x.sec>0);
const totalSec=s=>steps(s).reduce((a,x)=>a+x.sec,0);
const summary=s=>steps(s).map(x=>short(x.sec)).join(' · ');
// couleur : vert pour échauffement / récup, rouge pour le reste
const kindOf=l=>/recup|echauff|marche|calme|retour/.test(String(l).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase())?'easy':'hard';
function fmtDate(iso){
  const d=new Date(iso);
  const a=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const b=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return a.charAt(0).toUpperCase()+a.slice(1)+' · '+b;
}

/* ---------- audio (Web Audio uniquement : se mélange à Spotify) ---------- */
let ctx=null;
function initAudio(){
  try{
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();}
    if(ctx.state==='suspended')ctx.resume();
  }catch(e){}
}
function tone(f,d,t0=0,vol=0.5,type='sine'){
  if(!ctx)return;
  try{
    const t=ctx.currentTime+t0,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ctx.destination);
    o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sndCue15=()=>{tone(523,0.35,0,0.6,'triangle');tone(784,0.5,0.3,0.6,'triangle');vib([120,80,120])};
const sndBeep=()=>{tone(1000,0.14,0,0.6);vib(60)};
const sndGo=()=>{tone(1500,0.7,0,0.6);vib(400)};
const sndEnd=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.4,i*0.2,0.6,'triangle'));vib([200,100,200,100,400])};

/* ---------- accueil ---------- */
function home(){
  $('#run').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#app').innerHTML=`
  <h1>🏃 Fractionné tapis</h1>
  ${sessions.length?sessions.map((s,i)=>`
    <div class="card">
      <div style="font-weight:700;font-size:17px">${esc(s.name)}</div>
      <div class="mut" style="margin:4px 0 10px">${esc(summary(s))}<br>Durée totale : ${fmt(totalSec(s))}</div>
      <div class="row">
        <button class="pri grow" data-a="start" data-i="${i}">▶ Démarrer</button>
        <button data-a="edit" data-i="${i}">Modifier</button>
        <button data-a="dup" data-i="${i}">Dupliquer</button>
        <button class="dan" data-a="del" data-i="${i}">Supprimer</button>
      </div>
    </div>`).join(''):`<div class="card mut">Aucune séance pour l'instant. Crée ta première séance ci-dessous.</div>`}
  <button class="big pri" data-a="new">＋ Nouvelle séance</button>

  <h2 style="margin-top:22px">Historique</h2>
  ${hist.length?hist.slice(0,30).map((h,i)=>`
    <div class="card hist">
      <div class="row sp"><b>${esc(fmtDate(h.date))}</b><button class="sm dan" data-a="hdel" data-i="${i}">✕</button></div>
      <div style="margin-top:2px">${esc(h.name)}</div>
      <div class="mut">${esc(h.summary)}</div>
      <div class="mut">${h.partial?`Arrêtée à ${fmt(h.doneSec)} sur ${fmt(h.total)}`:`Terminée · ${fmt(h.total)}`}</div>
    </div>`).join(''):`<div class="card mut">Tes séances terminées apparaîtront ici.</div>`}

  <div class="card" style="margin-top:14px">
    <h2>Son</h2>
    <p class="mut" style="margin:0 0 10px">Lance ta musique (Spotify) puis teste : carillon des 15 s, 3 bips, tonalité de changement.</p>
    <button data-a="test">🔊 Tester les sons</button>
  </div>`;
  document.querySelectorAll('#app [data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,i=+b.dataset.i;
    if(a==='start')startRun(sessions[i]);
    else if(a==='edit'){editing=JSON.parse(JSON.stringify(sessions[i]));isNew=false;ui.rep=null;edit();}
    else if(a==='dup'){const c=JSON.parse(JSON.stringify(sessions[i]));c.id=uid();c.name+=' (copie)';sessions.splice(i+1,0,c);saveJ(KEY,sessions);home();}
    else if(a==='del'||a==='hdel'){
      if(b.dataset.c){
        if(a==='del'){sessions.splice(i,1);saveJ(KEY,sessions);}else{hist.splice(i,1);saveJ(HKEY,hist);}
        home();
      }else{const t=b.textContent;b.dataset.c=1;b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent=t}},3000);}
    }
    else if(a==='new'){
      editing={id:uid(),name:'Ma séance',steps:[{label:'Échauffement',sec:1200},{label:'Récup',sec:300}]};
      isNew=true;ui.rep=null;edit();
    }
    else if(a==='test'){initAudio();sndCue15();setTimeout(()=>{sndBeep();setTimeout(sndBeep,1000);setTimeout(sndBeep,2000);setTimeout(sndGo,3000)},2500);}
  });
}

/* ---------- éditeur ---------- */
const durHtml=(path,sec)=>`<div class="dur" data-dur="${path}"><input type="number" inputmode="numeric" min="0" value="${Math.floor(sec/60)}" data-part="m"><span>min</span><input type="number" inputmode="numeric" min="0" max="59" value="${sec%60}" data-part="s"><span>s</span></div>`;
const fld=(label,inner,cls='')=>`<div class="f ${cls}"><label class="l">${label}</label>${inner}</div>`;
const txt=(path,v)=>`<input type="text" data-p="${path}" value="${esc(v)}">`;
function gapHtml(at){
  if(ui.rep===at)return `<div class="card" style="border-color:var(--acc)">
    <h2>Ajouter des répétitions</h2>
    <div class="row" style="align-items:flex-end">
      ${fld('Nombre',`<input type="number" inputmode="numeric" min="1" data-p="form.n" data-num="1" value="${ui.form.n}">`,'')}
      ${fld('Effort',durHtml('form.e',ui.form.e))}
      ${fld('Récup',durHtml('form.r',ui.form.r))}
    </div>
    <label class="row" style="margin-top:10px"><input type="checkbox" data-p="form.last" ${ui.form.last?'checked':''}> <span class="mut">Ajouter aussi une récup après la dernière répétition</span></label>
    <p class="mut" style="margin:8px 0">Ça ajoute des étapes séparées : tu peux ensuite changer la durée de chacune (récups différentes).</p>
    <div class="row"><button class="grow" data-a="repcancel">Annuler</button><button class="grow pri" data-a="repok" data-at="${at}">Ajouter</button></div>
  </div>`;
  return `<div class="gap"><button data-a="addstep" data-at="${at}">＋ Étape</button><button data-a="addrep" data-at="${at}">＋ Répétitions</button></div>`;
}
function edit(){
  $('#run').classList.add('hidden');$('#app').classList.remove('hidden');
  const s=editing;
  $('#app').innerHTML=`
  <h1>${isNew?'Nouvelle séance':'Modifier la séance'}</h1>
  <div class="card">${fld('Nom de la séance',txt('name',s.name))}</div>
  ${s.steps.map((st,i)=>`
    <div class="card">
      <div class="row" style="align-items:flex-end">
        ${fld('Nom',txt(`steps.${i}.label`,st.label),'grow')}
        ${fld('Durée',durHtml(`steps.${i}.sec`,st.sec))}
      </div>
      <div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="sm" data-a="up" data-i="${i}">↑</button>
        <button class="sm" data-a="down" data-i="${i}">↓</button>
        <button class="sm" data-a="dupstep" data-i="${i}">Dupliquer</button>
        <button class="sm dan" data-a="rm" data-i="${i}">✕</button>
      </div>
    </div>
    ${gapHtml(i+1)}`).join('')}
  ${s.steps.length?'':gapHtml(0)}
  <div class="card"><span class="mut">Durée totale : </span><b id="tot">${fmt(totalSec(s))}</b></div>
  <div class="row">
    <button class="grow" data-a="cancel">Annuler</button>
    <button class="grow" data-a="save">Enregistrer</button>
    <button class="grow pri" data-a="saverun">Enregistrer & lancer</button>
  </div>`;
  const setPath=(path,val)=>{const k=path.split('.');let o=path.startsWith('form.')?ui:editing;for(let j=0;j<k.length-1;j++)o=o[k[j]];o[k[k.length-1]]=val;};
  const refreshTot=()=>{const t=$('#tot');if(t)t.textContent=fmt(totalSec(editing))};
  document.querySelectorAll('#app [data-p]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      let v=el.type==='checkbox'?el.checked:el.value;
      if(el.dataset.num)v=Math.max(1,parseInt(v)||1);
      setPath(el.dataset.p,v);refreshTot();
    };
  });
  document.querySelectorAll('#app [data-dur]').forEach(d=>{
    d.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
      const m=Math.max(0,parseInt(d.querySelector('[data-part=m]').value)||0);
      const sc=Math.max(0,parseInt(d.querySelector('[data-part=s]').value)||0);
      setPath(d.dataset.dur,m*60+sc);refreshTot();
    });
  });
  document.querySelectorAll('#app button[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,i=+b.dataset.i,at=+b.dataset.at,st=editing.steps;
    if(a==='up'&&i>0){[st[i-1],st[i]]=[st[i],st[i-1]];edit();}
    else if(a==='down'&&i<st.length-1){[st[i+1],st[i]]=[st[i],st[i+1]];edit();}
    else if(a==='rm'){st.splice(i,1);edit();}
    else if(a==='dupstep'){st.splice(i+1,0,{...st[i]});edit();}
    else if(a==='addstep'){st.splice(at,0,{label:'Étape',sec:300});edit();}
    else if(a==='addrep'){ui.rep=at;edit();}
    else if(a==='repcancel'){ui.rep=null;edit();}
    else if(a==='repok'){
      const f=ui.form,gen=[];
      for(let k=1;k<=f.n;k++){
        if(f.e>0)gen.push({label:`Effort ${k}/${f.n}`,sec:f.e});
        if((k<f.n||f.last)&&f.r>0)gen.push({label:'Récup',sec:f.r});
      }
      st.splice(at,0,...gen);ui.rep=null;edit();
    }
    else if(a==='cancel'){home();}
    else if(a==='save'||a==='saverun'){
      if(!editing.name.trim())editing.name='Ma séance';
      const idx=sessions.findIndex(x=>x.id===editing.id);
      if(idx>=0)sessions[idx]=editing;else sessions.push(editing);
      saveJ(KEY,sessions);
      if(a==='saverun')startRun(editing);else home();
    }
  });
}

/* ---------- lecteur de séance ---------- */
let R=null,wake=null;
async function getWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(R&&document.visibilityState==='visible'&&!R.done)getWake()});

function startRun(sess){
  initAudio();
  const list=[{label:'Prêt ? Monte sur le tapis',kind:'ready',sec:5},...steps(sess).map(x=>({label:x.label||'Étape',kind:kindOf(x.label),sec:x.sec}))];
  if(list.length<2)return;
  const now=performance.now();
  R={sess,steps:list,idx:0,stepEnd:now+list[0].sec*1000,lastSec:list[0].sec,paused:false,remainMs:0,done:false,
     total:list.slice(1).reduce((a,x)=>a+x.sec,0),timer:null};
  $('#app').classList.add('hidden');$('#run').classList.remove('hidden');
  $('#run').innerHTML=`
    <div class="top"><span>${esc(sess.name)}</span><span id="rTot"></span></div>
    <div class="mid">
      <div class="lab" id="rLab"></div>
      <div class="time" id="rTime"></div>
      <div class="nxt" id="rNxt"></div>
    </div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="ctl">
      <button id="bPrev">⏮</button><button id="bPause">⏸ Pause</button><button id="bNext">⏭</button><button id="bStop">⏹ Stop</button>
    </div>`;
  $('#bPrev').onclick=()=>jump(-1);
  $('#bNext').onclick=()=>jump(1);
  $('#bStop').onclick=stopRun;
  $('#bPause').onclick=togglePause;
  getWake();
  paint(list[0].sec*1000);
  R.timer=setInterval(tick,100);
}
function togglePause(){
  if(!R||R.done)return;
  const now=performance.now();
  if(!R.paused){R.paused=true;R.remainMs=R.stepEnd-now;$('#bPause').textContent='▶ Reprendre';}
  else{R.paused=false;R.stepEnd=now+R.remainMs;initAudio();$('#bPause').textContent='⏸ Pause';}
}
function jump(d){
  if(!R||R.done)return;
  const n=R.idx+d;
  if(n<0)return;
  if(n>=R.steps.length){finish();return;}
  R.idx=n;const st=R.steps[n];
  R.lastSec=st.sec;
  if(R.paused)R.remainMs=st.sec*1000;else R.stepEnd=performance.now()+st.sec*1000;
  sndGo();paint(st.sec*1000);
}
function tick(){
  if(!R||R.paused||R.done)return;
  const now=performance.now();
  let st=R.steps[R.idx];
  let rem=R.stepEnd-now;
  const secLeft=Math.max(0,Math.ceil(rem/1000));
  for(let v=R.lastSec-1;v>=secLeft&&v>=1;v--){
    if(v===15&&st.sec>15)sndCue15();
    else if(v<=3&&st.sec>3)sndBeep();
  }
  R.lastSec=Math.min(R.lastSec,secLeft);
  if(rem<=0){
    R.idx++;
    if(R.idx>=R.steps.length){finish();return;}
    st=R.steps[R.idx];
    R.stepEnd+=st.sec*1000;R.lastSec=st.sec;
    rem=R.stepEnd-now;
    sndGo();
  }
  paint(rem);
}
function paint(remMs){
  const st=R.steps[R.idx],nx=R.steps[R.idx+1];
  $('#run').className=st.kind;
  $('#rLab').textContent=st.label;
  $('#rTime').textContent=fmt(Math.ceil(remMs/1000));
  $('#rNxt').textContent=nx?`Ensuite : ${nx.label} · ${fmt(nx.sec)}`:'Dernière étape !';
  $('#rBar').style.width=(100*(1-remMs/(st.sec*1000)))+'%';
  let left=Math.ceil(remMs/1000);
  for(let i=R.idx+1;i<R.steps.length;i++)left+=R.steps[i].sec;
  if(R.idx===0)left=R.total;
  $('#rTot').textContent='Reste '+fmt(left);
}
function elapsed(){
  if(!R||R.idx===0)return 0;
  let d=0;for(let i=1;i<R.idx;i++)d+=R.steps[i].sec;
  const rem=R.paused?R.remainMs:Math.max(0,R.stepEnd-performance.now());
  return Math.round(d+R.steps[R.idx].sec-rem/1000);
}
function record(partial,doneSec){
  hist.unshift({date:new Date().toISOString(),name:R.sess.name,summary:summary(R.sess),total:R.total,partial,doneSec});
  hist=hist.slice(0,100);saveJ(HKEY,hist);
}
function finish(){
  clearInterval(R.timer);R.done=true;sndEnd();releaseWake();
  record(false,R.total);
  $('#run').className='done';
  $('#run').innerHTML=`<div class="mid"><div class="lab" style="font-size:40px">🎉 Séance terminée !</div>
    <div class="nxt">${esc(R.sess.name)}<br>Durée : ${fmt(R.total)}<br>Ajoutée à l'historique</div></div>
    <div class="ctl"><button id="bBack">Retour</button></div>`;
  $('#bBack').onclick=()=>{R=null;home();};
}
function stopRun(){
  if(R){
    clearInterval(R.timer);
    if(!R.done){const e=elapsed();if(e>=60)record(true,e);}
  }
  releaseWake();R=null;home();
}

home();
</script>
</body>
</html>
