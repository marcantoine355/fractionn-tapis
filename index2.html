<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fractionné tapis</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232732;--txt:#f2f4f8;--mut:#9aa3b2;--acc:#4f8cff;--easy:#1f9d62;--hard:#e5533d;--ready:#4b5565;--line:#2c313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:0;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
button{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);font-weight:700}
button.dan{color:#ff8a7a}
button.big{padding:16px;font-size:18px;width:100%}
button.sm{padding:6px 10px;font-size:14px}
input,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
label.l{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.dur{display:flex;gap:4px;align-items:center}
.dur input{width:64px;text-align:center}
.dur span{color:var(--mut);font-size:13px}
.f{display:flex;flex-direction:column}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin-right:6px}
.block{border-left:4px solid var(--acc)}
.block.rep{border-left-color:var(--hard)}
.sub{background:var(--card2);border-radius:12px;padding:10px;margin-top:8px}
.sub .row{align-items:flex-end}
/* runner */
#run{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));transition:background .3s}
#run.ready{background:var(--ready)}#run.easy{background:var(--easy)}#run.hard{background:var(--hard)}#run.done{background:#2b3b66}
#run .top{display:flex;justify-content:space-between;font-size:15px;opacity:.92}
#run .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#run .lab{font-size:28px;font-weight:800}
#run .time{font-size:clamp(84px,30vw,170px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#run .spd{font-size:30px;font-weight:700;background:rgba(0,0,0,.25);padding:4px 16px;border-radius:999px}
#run .nxt{font-size:17px;opacity:.95;margin-top:10px}
.bar{height:10px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar>i{display:block;height:100%;background:#fff;width:0}
#run .ctl{display:flex;gap:10px}
#run .ctl button{flex:1;background:rgba(0,0,0,.28);border-color:transparent;padding:16px 6px;font-size:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="run" class="hidden"></div>

<script>
/* ---------- stockage ---------- */
const KEY='fractionne-v1';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length)return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sessions))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const example=()=>({id:uid(),name:'Exemple : 20 min + 3×5 min + 10 min',blocks:[
  {type:'step',label:'Échauffement',kind:'easy',sec:1200,speed:''},
  {type:'repeat',reps:3,effort:{label:'Effort',sec:300,speed:''},rest:{label:'Récup',sec:60,speed:''},restAfterLast:false},
  {type:'step',label:'Récupération',kind:'easy',sec:600,speed:''}]});
let sessions=load()||[example()];
let editing=null,isNew=false;

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function flatten(sess){
  const out=[];
  for(const b of sess.blocks){
    if(b.type==='step'){ if(b.sec>0) out.push({label:b.label||'Étape',kind:b.kind,sec:b.sec,speed:b.speed}); }
    else{
      for(let i=1;i<=b.reps;i++){
        if(b.effort.sec>0) out.push({label:`${b.effort.label||'Effort'} ${i}/${b.reps}`,kind:'hard',sec:b.effort.sec,speed:b.effort.speed});
        if((i<b.reps||b.restAfterLast)&&b.rest.sec>0) out.push({label:b.rest.label||'Récup',kind:'easy',sec:b.rest.sec,speed:b.rest.speed});
      }
    }
  }
  return out;
}
const totalSec=s=>flatten(s).reduce((a,x)=>a+x.sec,0);
function summary(s){
  return s.blocks.map(b=>b.type==='step'?fmt(b.sec):`${b.reps}×${fmt(b.effort.sec)}${b.rest.sec?' / '+fmt(b.rest.sec):''}`).join(' → ');
}

/* ---------- audio (Web Audio uniquement : se mélange à Spotify) ---------- */
let ctx=null;
function initAudio(){
  try{
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();}
    if(ctx.state==='suspended')ctx.resume();
  }catch(e){}
}
function tone(f,d,t0=0,vol=0.5,type='sine'){
  if(!ctx)return;
  try{
    const t=ctx.currentTime+t0,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ctx.destination);
    o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sndCue15=()=>{tone(523,0.35,0,0.6,'triangle');tone(784,0.5,0.3,0.6,'triangle');vib([120,80,120])};
const sndBeep=()=>{tone(1000,0.14,0,0.6);vib(60)};
const sndGo=()=>{tone(1500,0.7,0,0.6);vib(400)};
const sndEnd=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.4,i*0.2,0.6,'triangle'));vib([200,100,200,100,400])};

/* ---------- accueil ---------- */
function home(){
  $('#run').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#app').innerHTML=`
  <h1>🏃 Fractionné tapis</h1>
  ${sessions.map((s,i)=>`
    <div class="card">
      <div style="font-weight:700;font-size:17px">${esc(s.name)}</div>
      <div class="mut" style="margin:4px 0 10px">${esc(summary(s))}<br>Durée totale : ${fmt(totalSec(s))}</div>
      <div class="row">
        <button class="pri grow" data-a="start" data-i="${i}">▶ Démarrer</button>
        <button data-a="edit" data-i="${i}">Modifier</button>
        <button data-a="dup" data-i="${i}">Dupliquer</button>
        <button class="dan" data-a="del" data-i="${i}">Supprimer</button>
      </div>
    </div>`).join('')}
  <button class="big" data-a="new">＋ Nouvelle séance</button>
  <div class="card" style="margin-top:14px">
    <h2>Son</h2>
    <p class="mut" style="margin:8px 0">Lance ta musique (Spotify) puis teste ici : tu dois entendre le carillon des 15 s, puis 3 bips, puis la tonalité de changement, sans que la musique s'arrête.</p>
    <button data-a="test">🔊 Tester les sons</button>
  </div>
  <p class="mut">Garde l'écran allumé pendant la séance (l'appli le demande automatiquement).</p>`;
  document.querySelectorAll('#app [data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,i=+b.dataset.i;
    if(a==='start')startRun(sessions[i]);
    else if(a==='edit'){editing=JSON.parse(JSON.stringify(sessions[i]));isNew=false;edit();}
    else if(a==='dup'){const c=JSON.parse(JSON.stringify(sessions[i]));c.id=uid();c.name+=' (copie)';sessions.splice(i+1,0,c);save();home();}
    else if(a==='del'){
      if(b.dataset.c){sessions.splice(i,1);save();home();}
      else{b.dataset.c=1;b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='Supprimer'}},3000);}
    }
    else if(a==='new'){editing={id:uid(),name:'Ma séance',blocks:[{type:'step',label:'Échauffement',kind:'easy',sec:600,speed:''}]};isNew=true;edit();}
    else if(a==='test'){initAudio();sndCue15();setTimeout(()=>{sndBeep();setTimeout(sndBeep,1000);setTimeout(sndBeep,2000);setTimeout(sndGo,3000)},2500);}
  });
}

/* ---------- éditeur ---------- */
function durHtml(path,sec){
  return `<div class="dur" data-dur="${path}"><input type="number" inputmode="numeric" min="0" value="${Math.floor(sec/60)}" data-part="m"><span>min</span><input type="number" inputmode="numeric" min="0" max="59" value="${sec%60}" data-part="s"><span>s</span></div>`;
}
function fld(label,inner,cls=''){return `<div class="f ${cls}"><label class="l">${label}</label>${inner}</div>`}
const txt=(path,v,ph='')=>`<input type="text" data-p="${path}" value="${esc(v)}" placeholder="${ph}">`;
const spd=(path,v)=>`<input type="number" inputmode="decimal" step="0.1" min="0" data-p="${path}" value="${esc(v)}" placeholder="km/h">`;
function edit(){
  $('#run').classList.add('hidden');$('#app').classList.remove('hidden');
  const s=editing;
  $('#app').innerHTML=`
  <h1>${isNew?'Nouvelle séance':'Modifier la séance'}</h1>
  <div class="card">${fld('Nom de la séance',txt('name',s.name))}</div>
  ${s.blocks.map((b,i)=>{
    const ctl=`<div class="row"><button class="sm" data-a="up" data-i="${i}">↑</button><button class="sm" data-a="down" data-i="${i}">↓</button><button class="sm dan" data-a="rm" data-i="${i}">✕</button></div>`;
    if(b.type==='step')return `<div class="card block">
      <div class="row sp"><h2>Étape</h2>${ctl}</div>
      <div class="row" style="margin-top:8px;align-items:flex-end">
        ${fld('Nom',txt(`blocks.${i}.label`,b.label),'grow')}
        ${fld('Intensité',`<select data-p="blocks.${i}.kind"><option value="easy" ${b.kind==='easy'?'selected':''}>Facile</option><option value="hard" ${b.kind==='hard'?'selected':''}>Intense</option></select>`)}
      </div>
      <div class="row" style="margin-top:8px;align-items:flex-end">
        ${fld('Durée',durHtml(`blocks.${i}.sec`,b.sec))}
        ${fld('Vitesse (optionnel)',spd(`blocks.${i}.speed`,b.speed),'grow')}
      </div></div>`;
    return `<div class="card block rep">
      <div class="row sp"><h2>Répétitions</h2>${ctl}</div>
      <div class="row" style="margin-top:8px">${fld('Nombre de répétitions',`<input type="number" inputmode="numeric" min="1" data-p="blocks.${i}.reps" data-num="1" value="${b.reps}">`,'grow')}</div>
      <div class="sub"><span class="tag">Effort</span>
        <div class="row">${fld('Nom',txt(`blocks.${i}.effort.label`,b.effort.label),'grow')}${fld('Durée',durHtml(`blocks.${i}.effort.sec`,b.effort.sec))}${fld('Vitesse',spd(`blocks.${i}.effort.speed`,b.effort.speed))}</div></div>
      <div class="sub"><span class="tag">Récupération entre les répétitions</span>
        <div class="row">${fld('Nom',txt(`blocks.${i}.rest.label`,b.rest.label),'grow')}${fld('Durée',durHtml(`blocks.${i}.rest.sec`,b.rest.sec))}${fld('Vitesse',spd(`blocks.${i}.rest.speed`,b.rest.speed))}</div></div>
      <label class="row" style="margin-top:10px"><input type="checkbox" data-p="blocks.${i}.restAfterLast" ${b.restAfterLast?'checked':''}> <span class="mut">Ajouter aussi une récup après la dernière répétition</span></label>
    </div>`;
  }).join('')}
  <div class="row" style="margin-bottom:12px">
    <button class="grow" data-a="addstep">＋ Étape</button>
    <button class="grow" data-a="addrep">＋ Répétitions</button>
  </div>
  <div class="card"><span class="mut">Durée totale : </span><b id="tot">${fmt(totalSec(s))}</b></div>
  <div class="row">
    <button class="grow" data-a="cancel">Annuler</button>
    <button class="grow" data-a="save">Enregistrer</button>
    <button class="grow pri" data-a="saverun">Enregistrer & lancer</button>
  </div>`;
  const setPath=(path,val)=>{const k=path.split('.');let o=editing;for(let j=0;j<k.length-1;j++)o=o[k[j]];o[k[k.length-1]]=val;};
  const refreshTot=()=>{const t=$('#tot');if(t)t.textContent=fmt(totalSec(editing))};
  document.querySelectorAll('#app [data-p]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      let v=el.type==='checkbox'?el.checked:el.value;
      if(el.dataset.num)v=Math.max(1,parseInt(v)||1);
      setPath(el.dataset.p,v);refreshTot();
    };
  });
  document.querySelectorAll('#app [data-dur]').forEach(d=>{
    d.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
      const m=Math.max(0,parseInt(d.querySelector('[data-part=m]').value)||0);
      const sc=Math.max(0,parseInt(d.querySelector('[data-part=s]').value)||0);
      setPath(d.dataset.dur,m*60+sc);refreshTot();
    });
  });
  document.querySelectorAll('#app button[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,i=+b.dataset.i,bl=editing.blocks;
    if(a==='up'&&i>0){[bl[i-1],bl[i]]=[bl[i],bl[i-1]];edit();}
    else if(a==='down'&&i<bl.length-1){[bl[i+1],bl[i]]=[bl[i],bl[i+1]];edit();}
    else if(a==='rm'){bl.splice(i,1);edit();}
    else if(a==='addstep'){bl.push({type:'step',label:'Étape',kind:'easy',sec:300,speed:''});edit();}
    else if(a==='addrep'){bl.push({type:'repeat',reps:3,effort:{label:'Effort',sec:300,speed:''},rest:{label:'Récup',sec:60,speed:''},restAfterLast:false});edit();}
    else if(a==='cancel'){home();}
    else if(a==='save'||a==='saverun'){
      if(!editing.name.trim())editing.name='Ma séance';
      const idx=sessions.findIndex(x=>x.id===editing.id);
      if(idx>=0)sessions[idx]=editing;else sessions.push(editing);
      save();
      if(a==='saverun')startRun(editing);else home();
    }
  });
}

/* ---------- lecteur de séance ---------- */
let R=null,wake=null;
async function getWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(R&&document.visibilityState==='visible'&&!R.done)getWake()});

function startRun(sess){
  initAudio();
  const steps=[{label:'Prêt ? Monte sur le tapis',kind:'ready',sec:5,speed:''},...flatten(sess)];
  if(steps.length<2){return;}
  const now=performance.now();
  R={sess,steps,idx:0,stepEnd:now+steps[0].sec*1000,lastSec:steps[0].sec,paused:false,remainMs:0,done:false,
     total:steps.slice(1).reduce((a,x)=>a+x.sec,0),timer:null};
  $('#app').classList.add('hidden');$('#run').classList.remove('hidden');
  $('#run').innerHTML=`
    <div class="top"><span id="rName">${esc(sess.name)}</span><span id="rTot"></span></div>
    <div class="mid">
      <div class="lab" id="rLab"></div>
      <div class="time" id="rTime"></div>
      <div class="spd hidden" id="rSpd"></div>
      <div class="nxt" id="rNxt"></div>
    </div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="ctl">
      <button id="bPrev">⏮</button><button id="bPause">⏸ Pause</button><button id="bNext">⏭</button><button id="bStop">⏹ Stop</button>
    </div>`;
  $('#bPrev').onclick=()=>jump(-1);
  $('#bNext').onclick=()=>jump(1);
  $('#bStop').onclick=()=>stopRun();
  $('#bPause').onclick=togglePause;
  getWake();
  paint(steps[0].sec*1000);
  R.timer=setInterval(tick,100);
}
function togglePause(){
  if(!R||R.done)return;
  const now=performance.now();
  if(!R.paused){R.paused=true;R.remainMs=R.stepEnd-now;$('#bPause').textContent='▶ Reprendre';}
  else{R.paused=false;R.stepEnd=now+R.remainMs;initAudio();$('#bPause').textContent='⏸ Pause';}
}
function jump(d){
  if(!R||R.done)return;
  const n=R.idx+d;
  if(n<0)return;
  if(n>=R.steps.length){finish();return;}
  R.idx=n;const st=R.steps[n];
  R.lastSec=st.sec;
  if(R.paused)R.remainMs=st.sec*1000;else R.stepEnd=performance.now()+st.sec*1000;
  sndGo();paint(st.sec*1000);
}
function tick(){
  if(!R||R.paused||R.done)return;
  const now=performance.now();
  let st=R.steps[R.idx];
  let rem=R.stepEnd-now;
  // événements sonores sur les secondes franchies
  const secLeft=Math.max(0,Math.ceil(rem/1000));
  for(let v=R.lastSec-1;v>=secLeft&&v>=1;v--){
    if(v===15&&st.sec>15)sndCue15();
    else if(v<=3&&st.sec>3)sndBeep();
  }
  R.lastSec=Math.min(R.lastSec,secLeft);
  if(rem<=0){
    R.idx++;
    if(R.idx>=R.steps.length){finish();return;}
    st=R.steps[R.idx];
    R.stepEnd+=st.sec*1000;R.lastSec=st.sec;
    rem=R.stepEnd-now;
    sndGo();
  }
  paint(rem);
}
function paint(remMs){
  const st=R.steps[R.idx],nx=R.steps[R.idx+1];
  const run=$('#run');run.className=st.kind;
  $('#rLab').textContent=st.label;
  $('#rTime').textContent=fmt(Math.ceil(remMs/1000));
  const sp=$('#rSpd');
  if(st.speed){sp.textContent=st.speed+' km/h';sp.classList.remove('hidden');}else sp.classList.add('hidden');
  $('#rNxt').textContent=nx?`Ensuite : ${nx.label} · ${fmt(nx.sec)}${nx.speed?' · '+nx.speed+' km/h':''}`:'Dernière étape !';
  $('#rBar').style.width=(100*(1-remMs/(st.sec*1000)))+'%';
  let left=Math.ceil(remMs/1000);
  for(let i=R.idx+1;i<R.steps.length;i++)left+=R.steps[i].sec;
  if(R.idx===0)left=R.total;
  $('#rTot').textContent='Reste '+fmt(left);
}
function finish(){
  clearInterval(R.timer);R.done=true;sndEnd();releaseWake();
  const run=$('#run');run.className='done';
  run.innerHTML=`<div class="mid"><div class="lab" style="font-size:40px">🎉 Séance terminée !</div>
    <div class="nxt">${esc(R.sess.name)}<br>Durée : ${fmt(R.total)}</div></div>
    <div class="ctl"><button id="bBack">Retour</button></div>`;
  $('#bBack').onclick=()=>{R=null;home();};
}
function stopRun(){
  if(R){clearInterval(R.timer);}
  releaseWake();R=null;home();
}

home();
</script>
</body>
</html>
